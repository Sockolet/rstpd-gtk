[package]
name = "rstpd"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
description = "A small, native Linux GTK3 text editor without plugins"
license = "MIT"
build = "build.rs"

[dependencies]
encoding_rs = "0.8"
fancy-regex = "0.19.2"
gtk = { version = "0.18", features = ["v3_24"] }
libc = "0.2"
regex = "1"
roxmltree = "0.21"
unicode-segmentation = "1"
json5 = "0.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
similar = "2"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
